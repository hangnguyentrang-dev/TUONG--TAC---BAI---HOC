<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm tương tác</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#16213e;--mut:#6a7490;--line:#dde3f0;--pri:#3a5bff;--ok:#16a34a;--bad:#e5484d;--yel:#ffc93c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#19203a;--ink:#e8ecfa;--mut:#97a1c4;--line:#2a3354;--pri:#6c86ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#19203a;--ink:#e8ecfa;--mut:#97a1c4;--line:#2a3354;--pri:#6c86ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#app{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(26px,5vw,38px);margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}
.crumb{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.crumb a{cursor:pointer;color:var(--pri);font-weight:500}.crumb a:hover{text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 18px 36px -14px hsl(var(--h) 70% 40%/.5);border-color:hsl(var(--h) 70% 60%)}
.card:active{transform:translateY(-2px) scale(.98)}
.band{height:104px;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 75% 46%));display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-size:38px;font-weight:800;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18);transition:transform .4s}
.card:hover .band::after{transform:scale(1.6)}
.cb{padding:14px 16px 16px}.cb b{display:block;font-size:17px;word-break:break-word}.cb span{color:var(--mut);font-size:13px}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
.ib{border:0;background:rgba(255,255,255,.9);color:#16213e;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;transition:transform .15s,background .15s}
.ib:hover{transform:scale(1.15);background:#fff}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--line);background:transparent;color:var(--mut);font-weight:500;gap:6px}
.add i{font-style:normal;font-size:34px;line-height:1;transition:transform .3s}
.add:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-4px)}.add:hover i{transform:rotate(90deg) scale(1.2)}
.b{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;display:inline-flex;gap:6px;align-items:center}
.b:hover{transform:translateY(-2px);filter:brightness(1.07)}.b:active{transform:scale(.96)}.b:disabled{opacity:.4;pointer-events:none}
.b.p{background:var(--pri);color:#fff;box-shadow:0 8px 18px -8px var(--pri)}
.b.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.b.y{background:var(--yel);color:#2b2100}
.b.r{background:var(--bad);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px}
.grid.big .band{height:170px;font-size:68px;padding:18px 22px}
.grid.big .band::after{width:170px;height:170px}
.grid.big .cb{padding:18px 22px 22px}.grid.big .cb b{font-size:22px}.grid.big .cb span{font-size:15px}
.grid.big .add{min-height:290px}
.grid.big .card:hover{transform:translateY(-8px) scale(1.02)}
.back{margin-bottom:14px}
.pt{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--mut)}
.pt input{width:78px;text-align:center;font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;outline:0;transition:border-color .2s,box-shadow .2s}
.pt input:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.bk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}.bk:hover{background:var(--bg)}
.bk input{width:18px;height:18px;accent-color:var(--pri);flex:none}
.bk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bk em{font-style:normal;color:var(--mut);font-size:13px;flex:none}
.bklist{max-height:260px;overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:4px}
.ptag{align-self:flex-start;background:var(--yel);color:#2b2100;font-weight:800;padding:4px 16px;border-radius:99px;margin-bottom:16px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--mut);margin-bottom:20px;transition:.2s}
.drop.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent);color:var(--pri)}
.qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:box-shadow .2s,border-color .2s}
.qc:hover,.qc:focus-within{box-shadow:0 10px 26px -16px var(--pri);border-color:var(--pri)}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.warn{color:var(--bad);font-size:13px;font-weight:500;margin-left:8px}
textarea,input[type=text],#mi{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;transition:border-color .2s,box-shadow .2s}
textarea:focus,input[type=text]:focus,#mi:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
textarea{resize:vertical;min-height:60px}
.opt{display:flex;align-items:center;gap:10px;margin-top:8px}
.opt>span{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:700;flex:none;transition:.2s}
.opt input[type=radio]{accent-color:var(--ok);width:20px;height:20px;cursor:pointer;flex:none}
.opt:has(input[type=radio]:checked)>span{background:var(--ok);color:#fff;transform:scale(1.1)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#modal{position:fixed;inset:0;background:rgba(10,14,30,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mb{background:var(--card);border-radius:18px;padding:22px;width:min(520px,100%);animation:up .25s}
.mb h3{margin:0 0 10px}.mb p{color:var(--mut);margin:0 0 12px}.mr{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:90;font-weight:500}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* trình chiếu */
#pres{position:fixed;inset:0;z-index:60;background:radial-gradient(1200px 700px at 20% 0,#27407a 0,#101a3a 55%,#0a1026 100%);color:#fff;display:flex;flex-direction:column;overflow:auto}
#pres[hidden]{display:none}
.prog{height:6px;background:rgba(255,255,255,.12);flex:none}.prog i{display:block;height:100%;background:var(--yel);transition:width .4s}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;font-weight:700;gap:12px}
.sc{background:rgba(255,255,255,.12);padding:6px 14px;border-radius:99px}
.x{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;transition:.2s}.x:hover{background:var(--bad);transform:rotate(90deg)}
.pw{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1100px;width:100%;margin:0 auto;padding:10px 28px}
.sl.in{animation:up .45s cubic-bezier(.2,.8,.2,1)}
.sl h2{font-size:clamp(24px,4vw,46px);line-height:1.25;margin:0 0 28px;font-weight:800;white-space:pre-wrap}
.po-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.po{display:flex;align-items:center;gap:16px;text-align:left;font:inherit;font-size:clamp(17px,2.2vw,26px);color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:16px 20px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,opacity .3s}
.po b{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;transition:.2s}
.po:hover{transform:translateY(-4px) scale(1.02);background:rgba(255,255,255,.16);border-color:var(--yel)}.po:hover b{background:var(--yel);color:#2b2100}
.po.ok{background:var(--ok);border-color:#7ef0a4}.po.ok b{background:#fff;color:var(--ok)}
.po.bad{background:var(--bad);border-color:#ff9a9d}.po.bad b{background:#fff;color:var(--bad)}
.po.dim{opacity:.4}.po.ok,.po.bad,.po.dim{pointer-events:none}
.po.pop{animation:pop .5s}.po.shake{animation:shake .45s}
.note{opacity:.8;margin-top:18px}
.bot{display:flex;justify-content:center;gap:12px;padding:18px;flex-wrap:wrap}
.res{text-align:center;align-items:center}.res .big{font-size:clamp(70px,16vw,150px);font-weight:800;line-height:1;color:var(--yel)}.res .big span{font-size:.4em;color:#fff;opacity:.7}
.trophy{font-size:80px;animation:pop .8s}.pb{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* dạng bài */
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ty{position:relative;cursor:pointer}.ty input{position:absolute;opacity:0;pointer-events:none}
.ty span{display:flex;flex-direction:column;gap:2px;height:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;transition:.2s}
.ty span i{font-style:normal;font-size:20px}.ty span b{font-size:14px}.ty span em{font-style:normal;color:var(--mut);font-size:12px}
.ty:hover span{border-color:var(--pri);transform:translateY(-2px)}
.ty input:checked+span{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.ty input:focus-visible+span{box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.lbl{margin:10px 0 4px;color:var(--mut);font-size:13px;font-weight:500}
.opt>b{color:var(--mut);flex:none}
.lab{opacity:.75;font-weight:500;margin:0 0 10px;font-size:clamp(14px,1.6vw,18px)}
.ta{width:100%;font:inherit;font-size:clamp(17px,2.2vw,26px);color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:16px 20px;min-height:90px;outline:0;resize:vertical}
.ta:focus{border-color:var(--yel);box-shadow:none}.ta::placeholder{color:rgba(255,255,255,.45);font-size:.7em}
.fb{border-radius:18px;padding:14px 20px;margin-top:14px;font-size:clamp(17px,2.2vw,26px);white-space:pre-wrap;border:2px solid;word-break:break-word}
.fb small{display:block;opacity:.8;font-size:12px;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fb.ok{background:rgba(22,163,74,.35);border-color:#7ef0a4}.fb.bad{background:rgba(229,72,77,.3);border-color:#ff9a9d}.fb.key{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}.mcol{display:flex;flex-direction:column;gap:12px}
.mcol .po{font-size:clamp(15px,1.9vw,22px);padding:12px 16px;justify-content:center;text-align:center}
.po.sel{border-color:var(--yel);background:rgba(255,201,60,.25)}
/* điền chỗ trống */
.cloze{font-size:clamp(22px,3.6vw,42px);font-weight:700;line-height:2.1;margin:0 0 18px;white-space:pre-wrap}
input.bl{font:inherit;font-weight:800;color:var(--yel);background:rgba(255,255,255,.1);border:0;border-bottom:3px solid var(--yel);border-radius:8px 8px 0 0;padding:0 8px;margin:0 4px;text-align:center;outline:0;box-shadow:none;max-width:100%}
input.bl:focus{background:rgba(255,255,255,.22);box-shadow:none}
input.bl.ok{color:#fff;background:var(--ok);border-color:#7ef0a4}
input.bl.bad{color:#fff;background:var(--bad);border-color:#ff9a9d}
input.bl.key{color:#fff;border-color:#fff}
/* số câu to + đoạn văn */
.qno{font-size:clamp(26px,4vw,46px);font-weight:800;line-height:1;background:rgba(255,255,255,.12);padding:8px 22px;border-radius:99px;white-space:nowrap}
.qno b{color:var(--yel)}.qno small{font-size:.6em;opacity:.7;font-weight:700}
.sc{font-size:clamp(15px,1.8vw,20px)}
.x.th{font-size:18px}.x.th:hover{background:var(--yel);transform:none}
.pw.wide{max-width:1500px}
.pg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
.pas{position:relative;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:18px 22px;max-height:calc(100vh - 230px);overflow:auto;white-space:normal;font-size:clamp(15px,1.6vw,21px);line-height:1.9}
.pq h2{font-size:clamp(20px,2.6vw,34px);margin:0 0 20px}
.pq .po-grid{grid-template-columns:1fr}
.pq .po{font-size:clamp(16px,1.9vw,24px);padding:14px 18px}
mark.bk{display:inline;gap:0;cursor:default;pointer-events:none;white-space:nowrap;background:rgba(255,255,255,.16);color:inherit;border-radius:6px;padding:1px 8px;font-size:.92em}
.rdo{margin-top:18px}
/* bài học (unit) + tiến độ */
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 40) 75% 45%));transition:width .4s}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;margin-top:8px}
.st.done{background:rgba(22,163,74,.2);color:#16a34a}.st.mid{background:rgba(255,201,60,.25);color:#b07a00}.st.new{background:var(--bg);color:var(--mut)}
input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}

/* sắp xếp câu: chế độ + kéo thả */
.omode{display:inline-flex;background:rgba(255,255,255,.12);border-radius:99px;padding:4px;margin-bottom:14px;gap:4px}
.om{border:0;font:inherit;font-weight:700;font-size:15px;color:#fff;background:transparent;border-radius:99px;padding:6px 16px;cursor:pointer;transition:background .15s}
.om.on{background:var(--yel);color:#2b2100}
.wpool{min-height:64px;padding:2px;border-radius:14px;transition:background .15s}
.wpool.over,.wbox.over{background:rgba(255,201,60,.18);outline:2px dashed var(--yel)}
.wd[draggable=true]{cursor:grab}.wd.dragging{opacity:.4}.wd.st{cursor:default;pointer-events:none}
#pres.light .omode{background:#e8eefc}#pres.light .om{color:#16213e}#pres.light .om.on{color:#2b2100}

mark.bk{transition:background .25s,color .25s}
mark.bk.cur{background:var(--yel);color:#2b2100;font-weight:800}
mark.bk.ok{background:var(--ok);color:#fff}mark.bk.bad{background:var(--bad);color:#fff}
@media (max-width:900px){.pg{grid-template-columns:1fr}.pas{max-height:40vh}}
/* trình chiếu giao diện sáng */
#pres.light{background:radial-gradient(1200px 700px at 20% 0,#e3ebff 0,#f2f5fb 55%,#e8eefc 100%);color:#16213e}
#pres.light .prog{background:rgba(22,33,62,.12)}
#pres.light .sc,#pres.light .qno{background:rgba(22,33,62,.08)}
#pres.light .qno b{color:#c27c00}
#pres.light .x{background:rgba(22,33,62,.1);color:#16213e}
#pres.light .x:hover{background:var(--bad);color:#fff}#pres.light .x.th:hover{background:var(--yel);color:#2b2100}
#pres.light .top .b,#pres.light .b[data-p=self]{color:#16213e!important;background:rgba(22,33,62,.1)!important}
#pres.light .po{color:#16213e;background:#fff;border-color:#cfd8ee}
#pres.light .po b{background:#e8eefc}
#pres.light .po:hover{background:#fff;border-color:var(--pri)}#pres.light .po:hover b{background:var(--yel)}
#pres.light .po.ok{color:#fff;background:var(--ok);border-color:#7ef0a4}
#pres.light .po.bad{color:#fff;background:var(--bad);border-color:#ff9a9d}
#pres.light .po.sel{background:#fff3cf;border-color:#e0a800}
#pres.light .ta{color:#16213e;background:#fff;border-color:#cfd8ee}#pres.light .ta::placeholder{color:#7a86a8}
#pres.light .fb.ok{background:#d9f7e4;border-color:#16a34a}
#pres.light .fb.bad{background:#fde3e4;border-color:#e5484d}
#pres.light .fb.key{background:#fff;border-color:#cfd8ee}
#pres.light input.bl{color:#8a5a00;background:#fff3cf;border-color:#e0a800}
#pres.light input.bl.ok{color:#fff;background:var(--ok);border-color:#7ef0a4}
#pres.light input.bl.bad{color:#fff;background:var(--bad);border-color:#ff9a9d}
#pres.light input.bl.key{color:#16213e;background:#fff;border-color:#16213e}
/* sửa lỗi sai: bấm từng từ */
.fxs{font-size:clamp(24px,4vw,46px);font-weight:800;line-height:2;margin:0 0 20px;word-break:break-word}
.tk{display:inline-block;padding:0 8px;border-radius:10px;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s}
.tk:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.tk.on{background:rgba(255,201,60,.35);box-shadow:inset 0 -4px 0 var(--yel)}
.tk.lk{cursor:default;pointer-events:none}.tk.lk:hover{transform:none;background:none}
.tk.lk.on{background:rgba(255,201,60,.35)}
.tk.wr{color:#ff9a9d;text-decoration:underline wavy #ff9a9d;text-underline-offset:6px}
.fxl{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.fxr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 12px;font-size:clamp(16px,2vw,24px);animation:pop .35s}
.fxo{font-weight:800;color:var(--yel);background:rgba(255,201,60,.18);border-radius:8px;padding:0 10px;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
input.fxin{font:inherit;font-weight:700;color:#fff;background:rgba(255,255,255,.1);border:0;border-bottom:3px solid var(--yel);border-radius:8px 8px 0 0;padding:2px 10px;min-width:150px;width:200px;max-width:100%;outline:0;box-shadow:none}
input.fxin:focus{background:rgba(255,255,255,.22);box-shadow:none}
input.fxin::placeholder{color:rgba(255,255,255,.45);font-size:.75em;font-weight:500}
.fxk{line-height:1.9}
mark.fxa{background:var(--ok);color:#fff;border-radius:8px;padding:1px 8px;font-weight:800;box-shadow:0 0 0 2px #7ef0a4}

<script>

/* ---------- Nhận diện câu hỏi ---------- */
const FM='\uE000',FE='\uE001',OKT=/\s*(?:\(\s*(?:đúng|correct|x)\s*\)|\[\s*(?:đúng|correct|x)\s*\]|[*✓✔✅☑])+\s*$/iu;
/* tách một dòng thành các phương án (A. B. C. D.), nhớ phương án nào được in đậm / gạch chân */
function segs(s){
 let t='',f=[],on=false;
 for(let i=0;i<s.length;i++){const ch=s[i];if(ch===FM){on=true;continue}if(ch===FE){on=false;continue}t+=ch;f.push(on&&/\S/.test(ch))}
 const cuts=[0];

const BLK=/\[\s*\]|\(\s*\.{2,}\s*\)|\.{3,}|…+|_+/g;

function parsePassage(t){

 const NUM=/^\s*(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu,OPT=/^\s*\*?\s*\(?[A-Da-d][.)]\s/;

 const KEYLINE=/^(?:\d+\s*[.:\-)=]?\s*\(?[A-Da-d]\)?(?![\p{L}\d])[\s,;]*){2,}$/iu;

  for(let i=0;i<lines.length&&st<0;i++){
   const m=lines[i].match(NUM);if(!m)continue;
   if([m[2],...lines.slice(i+1,i+4)].some(x=>OPT.test(x)))st=i;
  }
  if(st<0)continue;
  const pid=uid(),group=[],key={};let c=null;
  passages[pid]=lines.slice(0,st).join('\n').trim();
  const fl=()=>{if(c){if(c.a<0&&c.fm.size===1)c.a=[...c.fm][0];delete c.fm;c.q=c.q.trim();c.o=c.o.map(x=>x.trim());delete c.last;group.push(c);c=null}};
  const feed=x=>{for(const p of segs(x)){if(!optTake(c,p.t,p.f)){if(c.last!=null)c.o[c.last]+=' '+p.t;else c.q+=' '+p.t}}};

   const s=lines[i].trim();if(!s)continue;let m;
   if((m=s.match(KEY))){
    const rest=m[1].trim();
    if(!addPairs(rest)){const sm=rest.match(/^\(?([A-Da-d])(?![\p{L}\d])/u);if(sm&&c)c.a='ABCD'.indexOf(sm[1].toUpperCase())}

   }
   if(KEYLINE.test(s)){addPairs(s);continue}

   if(c)feed(raw[i]);
  }
  fl();
  group.forEach(q=>{if(key[q.n]!=null)q.a=key[q.n]});
  qs.push(...group);

}

/* đọc .docx; với trắc nghiệm thì giữ lại chữ in đậm / gạch chân để nhận đáp án */
async function docxText(buf,fmt){
 if(fmt)try{
  const r=await mammoth.convertToHtml({arrayBuffer:buf},{styleMap:['u => u']}),d=new DOMParser().parseFromString(r.value,'text/html'),B='p,li,h1,h2,h3,h4,h5,h6';
  const w=(n,f)=>n.nodeType===3?n.nodeValue:n.nodeType!==1?'':n.tagName==='BR'?'\n':/^(STRONG|B|U)$/.test(n.tagName)&&!f?FM+[...n.childNodes].map(x=>w(x,1)).join('')+FE:[...n.childNodes].map(x=>w(x,f)).join('');
  const t=[...d.body.querySelectorAll(B)].filter(e=>!e.querySelector(B)).map(e=>w(e)).join('\n');
  if(t.trim())return t;
 }catch(e){}
 return (await mammoth.extractRawText({arrayBuffer:buf})).value;
}

   h+=`<div class="fb key fxk"><small>Đáp án</small>${ans}<div class="fxg"><mark class="fxa">chữ</mark> chỗ đã sửa / thêm${hasDel?' · <del class="fxd">chữ</del> từ bị bỏ':''}</div></div>`;
   if(keys.length>1)h+=`<p class="note" style="font-size:14px">Cũng chấp nhận: ${keys.slice(1).map(esc).join(' · ')}</p>`;
  }
  return h+'</div>';
 }
 const rv=t==='vocab'&&q.rev,given=rv?q.a:q.q,exp=rv?q.q:q.a;
 const lab=t==='essay'?'Viết câu trả lời':t==='fix'?'Tìm lỗi sai và sửa lại thành câu đúng':P.dir==='en-vi'?'Gõ nghĩa tiếng Việt':P.dir==='vi-en'?'Gõ nghĩa tiếng Anh':'Gõ nghĩa của từ / cụm từ';
 let h=c+`<p class="lab">${lab}</p><h2>${esc(given)}</h2>`;
 if(!rev)h+=`<textarea class="ta" rows="${t==='vocab'?2:4}" placeholder="Nhập câu trả lời… (Enter để kiểm tra, Shift+Enter xuống dòng)">${esc(s.val)}</textarea><div style="margin-top:14px"><button class="b y" data-p="submit">✓ Kiểm tra</button></div>`;
 else{
  if(s.sub)h+=`<div class="fb ${s.ok?'ok':'bad'}"><small>Bạn trả lời${s.self?' (tự chấm đúng)':s.ok?' · chính xác':''}</small>${esc(s.val)}</div>`;
  if(P.show[P.i]&&!s.ok||s.self)h+=`<div class="fb key"><small>Đáp án</small>${esc(exp)}</div>`;
  if(s.sub&&!s.ok)h+=`<div style="margin-top:14px"><button class="b g" data-p="self" style="background:rgba(255,255,255,.12);color:#fff;border:0">Cách trả lời của mình cũng đúng ✓</button></div>`;
 }
 return h+'</div>';
}
function drawP(anim){
 const el=$('#pres');if(!P)return;const n=P.qs.length,tot=P.qs.reduce((s,q)=>s+clampP(q.p),0);
 saveResume();
 if(P.done){markDone();
  const pc=Math.round(P.sc/tot*100),ok=P.duel?dlOk():P.t==='mc'?P.qs.filter((q,i)=>q.a>=0&&P.ans[i]===q.a).length:P.st.filter(s=>s.ok).length;
  el.innerHTML=`<div class="pw res sl in"><div class="trophy">${pc>=80?'🏆':pc>=50?'👏':'💪'}</div><h2>Hoàn thành</h2>${P.tm?tmResult():`<div class="big">${fmt(P.sc)}<span>/${tot}</span></div>`}<p>${ok}/${n} ${P.t==='flash'?'thẻ nhớ ngay lần đầu':'câu đúng'}, đạt ${pc}% số điểm</p><div class="pb"><button class="b y" data-p="again">↻ Làm lại</button>${P.t==='flash'||P.duel?'':'<button class="b g" data-p="review">Xem lại đáp án</button>'}<button class="b g" data-p="exit">← Trở lại</button></div></div>`;return;
 }
 if(P.duel)return drawD(anim);
 if(P.t==='flash')return drawF();
 const q=P.qs[P.i],op=$('#pres .pas'),pst=op?op.scrollTop:null,opid=P.lastPid;
 el.innerHTML=`<div class="prog"><i style="width:${(P.i+1)/n*100}%"></i></div><div class="top"><button class="b g" data-p="exit" style="color:#fff;background:rgba(255,255,255,.12);border:0" title="Esc">← Trở lại</button><span class="qno">Câu <b>${P.i+1}</b><small>/${n}</small></span><span style="display:flex;gap:10px;align-items:center"><span class="sc">${P.tm?'⚔ Đấu theo đội':`⭐ ${fmt(P.sc)}/${tot} điểm`}</span><button class="x th" data-p="theme" title="Giao diện sáng / tối (T)">${PL?'🌙':'☀️'}</button></span></div>
 ${P.tm?tmHTML(P.tm.last||Array(P.tm.n).fill(0)):''}
 ${P.t==='mc'?bodyMC(q,anim):withRedo(bodyX(q,anim))}
 <div class="bot"><button class="b g" data-p="prev" ${P.i?'':'disabled'}>← Trước</button><button class="b y" data-p="show">👁 Hiện đáp án</button><button class="b p" data-p="next">${P.i===n-1?'Kết thúc ✓':'Sau →'}</button></div>`;
 if(P.tm)tmFx();
 const ta=$('#pres .ta')||$('#pres .bl:not([readonly])');if(ta){ta.focus();const L=ta.value.length;ta.setSelectionRange(L,L)}
 const np=$('#pres .pas');if(np){const cur=np.querySelector('mark.cur');if(!anim&&pst!=null&&opid===q.pid)np.scrollTop=pst;else if(cur)np.scrollTop=Math.max(0,cur.offsetTop-np.clientHeight/3);P.lastPid=q.pid}
}
function drawF(){
 const n=P.qs.length,tot=P.qs.reduce((s,q)=>s+clampP(q.p),0),k=P.fq[0],q=P.qs[k],r=q.rev;
 $('#pres').innerHTML=`<div class="prog"><i style="width:${(n-P.fq.length)/n*100}%"></i></div><div class="top"><button class="b g" data-p="exit" style="color:#fff;background:rgba(255,255,255,.12);border:0">← Trở lại</button><span class="qno">Còn <b>${P.fq.length}</b><small>/${n} thẻ</small></span><span style="display:flex;gap:10px;align-items:center"><span class="sc">⭐ ${fmt(P.sc)}/${tot} điểm</span><button class="x th" data-p="theme" title="Giao diện sáng / tối (T)">${PL?'🌙':'☀️'}</button></span></div>
 <div class="pw"><div class="fc${P.flip?' back':''}" data-p="flip"><div><small>${P.flip?'Mặt sau':'Mặt trước · bấm để lật'}</small>${esc(P.flip?(r?q.q:q.a):(r?q.a:q.q))}</div></div>${P.st[k].miss?'<p class="note" style="text-align:center">Thẻ ôn lại: lần trước bạn chưa nhớ</p>':''}</div>
 <div class="bot"><button class="b g" data-p="again">↻ Làm lại</button>${P.flip?'<button class="b r" data-p="unk">✗ Chưa nhớ</button><button class="b p" style="background:var(--ok)" data-p="know">✓ Đã nhớ</button>':'<button class="b y" data-p="flip">🔄 Lật thẻ</button>'}</div>`;
}
let DRG=null,DRC=null,IMGI=0;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('.wd[data-p="ct"],.wd[data-p="lt"],.wd[data-p="bt"]');if(!t||!P)return;DRC=+t.dataset.k;try{e.dataTransfer.setData('text/plain','x');e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',()=>{DRC=null;document.querySelectorAll('[data-cz].over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-cz]');if(z&&DRC!=null){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-cz]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-cz]');if(!z||DRC==null||!P)return;e.preventDefault();z.classList.remove('over');P.st[P.i].sel=DRC;DRC=null;pAct(P.t==='cat'?'cb':P.t==='bank'?'bs':'sp',+z.dataset.cz)});
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('.wd[draggable="true"]');if(!t||!P||P.t!=='order')return;DRG=+t.dataset.k;t.classList.add('dragging');try{e.dataTransfer.setData('text/plain',String(DRG));e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',()=>{DRG=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&DRG!=null){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',e=>{
 const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||DRG==null||!P||P.t!=='order')return;
 e.preventDefault();const s=P.st[P.i];if(s.fin||P.show[P.i])return;
 const k=DRG;DRG=null;
 let ix=s.pool.indexOf(k);if(ix>=0)s.pool.splice(ix,1);else{ix=s.ch.indexOf(k);if(ix>=0)s.ch.splice(ix,1)}
 if(z.dataset.drop==='pool')s.pool.push(k);
 else{let pos=0;z.querySelectorAll('.wd[data-k]').forEach(el=>{if(+el.dataset.k===k)return;const r=el.getBoundingClientRect();if(e.clientY>r.bottom||(e.clientY>=r.top&&e.clientX>r.left+r.width/2))pos++});s.ch.splice(Math.min(pos,s.ch.length),0,k)}
 drawP(false)});
function pAct(a,k){
 if(!P)return;const n=P.qs.length,q=P.qs[P.i],s=P.st[P.i];
 if(a==='exit')return closeP();
 if(P.t==='flash'&&!P.done){
  if(a==='next')a=P.flip?'know':'flip';else if(a==='prev')a=P.flip?'unk':'';else if(a==='show')a=P.flip?'':'flip';
  if(a==='flip'){P.flip=!P.flip;return drawP(false)}
  if(a==='know'||a==='unk'){
   if(!P.flip)return;
   const i0=P.fq.shift(),st0=P.st[i0];
   if(a==='know'){if(!st0.miss){st0.ok=true;addSc(clampP(P.qs[i0].p))}}else{st0.miss=true;P.fq.push(i0)}
   P.flip=false;if(!P.fq.length)P.done=true;return drawP(true);
  }
 }
 if(a==='pick'){
  if(P.t!=='mc'||P.done||P.ans[P.i]!=null||P.show[P.i])return;
  P.ans[P.i]=k;if(k===q.a)addSc(ptsQ(P.i));drawP(false);
  const b=$(`#pres .po[data-k="${k}"]`);if(b)b.classList.add(k===q.a?'pop':'shake');
 }
 else if(a==='submit'){
  if(P.t==='mc'||P.t==='match'||P.done||s.fin)return;
  if(P.t==='order'){
   if(OM!=='type')return;
   const ta=$('#pres .ta');if(ta)s.val=ta.value;
   if(!s.val.trim())return toast('Hãy nhập câu trả lời');
   s.fin=true;s.sub=true;s.mode='type';s.ok=q._alts.some(x=>fxSame(q._ch?s.val.replace(/\s+/g,''):s.val,x));if(s.ok)addSc(ptsQ(P.i));drawP(false);return;
  }
  if(P.t==='fill'){
   document.querySelectorAll('#pres .bl').forEach(b=>{s.vals[+b.dataset.k]=b.value});
   const f=q._f;if(!f.ans.some((_,k)=>(s.vals[k]||'').trim()))return toast('Hãy nhập phần còn thiếu');
   s.res=f.ans.map((al,k)=>al.some(x=>eqAns(x,s.vals[k])));
   const c=s.res.filter(Boolean).length;s.fin=true;s.sub=true;s.ok=c===f.ans.length;s.got=r2(ptsQ(P.i)*c/f.ans.length);addSc(s.got);drawP(false);return;
  }
  if(P.t==='fix'){
   if(s.sub)return;
   document.querySelectorAll('#pres .fxin').forEach(b=>{s.fx[+b.dataset.k]=b.value});
   if(!s.sel.length)return toast('Hãy bấm vào từ bị sai trong câu');
   const mine=fxJoin(fxTok(q.q),s.sel,s.fx);
   s.sub=true;s.ok=fxKeys(q).some(k=>fxSame(mine,k));
   if(s.ok){s.fin=true;s.got=ptsQ(P.i);addSc(s.got)}
   drawP(false);return;
  }
  const ta=$('#pres .ta');if(ta)s.val=ta.value;
  if(!s.val.trim())return toast('Hãy nhập câu trả lời');
  s.fin=true;s.sub=true;s.ok=okText(P.t,q,s.val);if(s.ok)addSc(ptsQ(P.i));drawP(false);
 }
 else if(a==='ft'){
  if(P.t!=='fix'||s.fin||s.sub||P.show[P.i])return;
  const x=s.sel.indexOf(k),adding=x<0;
  document.querySelectorAll('#pres .fxin').forEach(b=>{s.fx[+b.dataset.k]=b.value});
  if(adding){s.sel.push(k);s.sel.sort((u,v)=>u-v)}else s.sel.splice(x,1);
  const starts=new Set(fxGroups(s.sel).map(g=>g[0]));
  Object.keys(s.fx).forEach(key=>{if(!starts.has(+key))delete s.fx[key]});
  drawP(false);
  if(adding){const g=fxGroups(s.sel).find(g=>k>=g[0]&&k<=g[1]),f=g&&$(`#pres .fxin[data-k="${g[0]}"]`);if(f)f.focus()}
 }
 else if(a==='redo'){
  if(!canRedo())return;
  const i=P.i;
  if(P.t==='mc'){(P.el[i]=P.el[i]||[]).push(P.ans[i]);P.ans[i]=null}
  else{addSc(-(s.got||0));P.st[i]=stFor(P.t,q)}
  if(P.t==='mc')P.rt[i]++;drawP(false);
 }
 else if(a==='self'){
  if(s.sub&&!s.ok){const av=ptsQ(P.i);s.ok=true;s.self=true;s.fin=true;addSc(av-(s.got||0));s.got=av;drawP(false)}
 }
 else if(a==='mL'||a==='mR'){
  if(P.t!=='match'||s.fin||P.show[P.i])return;
  const side=a==='mL'?'L':'R';
  if(!s.sel||s.sel.side===side){s.sel=(s.sel&&s.sel.side===side&&s.sel.k===k)?null:{side,k};drawP(false);return}
  const other=s.sel.k;s.sel=null;
  if(other===k){
   s.m.push(k);
   if(s.m.length===q.pairs.length){s.fin=true;s.ok=s.miss===0;s.got=r2(ptsQ(P.i)*Math.max(0,1-s.miss/q.pairs.length));addSc(s.got)}
   drawP(false);
   document.querySelectorAll(`#pres .po[data-k="${k}"]`).forEach(b=>b.classList.add('pop'));
  }else{
   s.miss++;drawP(false);
   const L=a==='mL'?k:other,R=a==='mL'?other:k;
   document.querySelectorAll(`#pres .po[data-p="mL"][data-k="${L}"],#pres .po[data-p="mR"][data-k="${R}"]`).forEach(b=>b.classList.add('shake'));
  }
 }
 else if(a==='ow'||a==='oc'){
  if(P.t!=='order'||s.fin||P.show[P.i])return;
  const A=a==='ow'?s.pool:s.ch,B=a==='ow'?s.ch:s.pool,x=A.indexOf(k);
  if(x>=0){A.splice(x,1);B.push(k)}drawP(false);
 }
 else if(a==='omd'||a==='omt'){if(P.t==='order'&&!s.fin&&!P.show[P.i]){OM=a==='omt'?'type':'drag';drawP(false)}}
 else if(a==='ores'){if(P.t==='order'&&!s.fin){s.pool=s.pool.concat(s.ch);s.ch=[];drawP(false)}}
 else if(a==='ocheck'){
  if(P.t!=='order'||s.fin||s.pool.length)return;
  const got=s.ch.map(x=>q._w[x]).join(q._ch?'':' ');
  s.fin=true;s.sub=true;s.mode='drag';s.ok=q._alts.some(x=>fxSame(got,x));if(s.ok)addSc(ptsQ(P.i));drawP(false);
 }
 else if(a==='cd'){
  if(P.t!=='memory'||s.fin||P.show[P.i])return;
  if(s.open.length>=2)s.open=[];
  if(s.open.includes(k)||s.done.includes(s.cards[k].k))return;
  s.open.push(k);
  if(s.open.length===2){
   const [x,y]=s.open;
   if(s.cards[x].k===s.cards[y].k){s.done.push(s.cards[x].k);s.open=[];if(s.done.length===q.pairs.length){s.fin=true;s.ok=s.miss===0;s.got=r2(ptsQ(P.i)*Math.max(0,1-s.miss/q.pairs.length));addSc(s.got)}}
   else{s.miss++;const i0=P.i;setTimeout(()=>{if(P&&P.st[i0]===s&&s.open.length===2){s.open=[];drawP(false)}},900)}
  }
  drawP(false);
 }
 else if(a==='ct'){if(P.t!=='cat'||s.fin||P.show[P.i])return;if(s.put[k]!=null){delete s.put[k];s.pool.push(k);s.sel=null}else s.sel=s.sel===k?null:k;drawP(false)}
 else if(a==='cb'){if(P.t!=='cat'||s.fin||P.show[P.i]||s.sel==null)return;const x=s.sel,ix=s.pool.indexOf(x);if(ix>=0)s.pool.splice(ix,1);s.put[x]=k;s.sel=null;drawP(false)}
 else if(a==='lt'||a==='bt'){if(!['label','bank'].includes(P.t)||s.fin||P.show[P.i])return;s.sel=s.sel===k?null:k;drawP(false)}
 else if(a==='sp'||a==='bs'){
  if(!['label','bank'].includes(P.t)||s.fin||P.show[P.i])return;
  const cur=s.put[k];
  if(s.sel==null){if(cur!=null){s.pool.push(cur);delete s.put[k]}return drawP(false)}
  const x=s.sel;s.sel=null;const ix=s.pool.indexOf(x);if(ix>=0)s.pool.splice(ix,1);else for(const j in s.put)if(s.put[j]===x)delete s.put[j];
  if(cur!=null)s.pool.push(cur);s.put[k]=x;drawP(false);
 }
 else if(a==='lcheck'){
  if(!['cat','label','bank'].includes(P.t)||s.fin||s.pool.length)return;
  let res;
  if(P.t==='cat')res=q.pairs.map((_,j)=>s.put[j]===q._ci[j]);
  else if(P.t==='bank'){res=q._f.ans.map((al,k)=>al.some(x=>eqAns(x,q._bk[s.put[k]])));s.vals=q._f.ans.map((_,k)=>q._bk[s.put[k]]||'')}
  else res=q.pts.map((p,k)=>norm(q.pts[s.put[k]].t)===norm(p.t));
  s.res=res;const c=res.filter(Boolean).length;s.fin=true;s.sub=true;s.ok=c===res.length;s.got=r2(ptsQ(P.i)*c/res.length);addSc(s.got);drawP(false);
 }
 else if(a==='say'){try{const u=new SpeechSynthesisUtterance(q.q);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Trình duyệt không hỗ trợ đọc mẫu')}}
 else if(a==='spself'){if(P.t==='speak'&&!s.fin){s.fin=s.sub=s.ok=true;s.got=ptsQ(P.i);addSc(s.got);drawP(false)}}
 else if(a==='theme'){PL=!PL;try{localStorage.setItem('quizpres',PL?'light':'dark')}catch(e){}$('#pres').classList.toggle('light',PL);drawP(false)}
 else if(a==='show'){if(P.t!=='mc'&&!s.fin)s.fin=true;P.show[P.i]=true;drawP(false)}
 else if(a==='next'){if(P.i===n-1)P.done=true;else P.i++;drawP(true)}
 else if(a==='prev'){if(P.i)P.i--;drawP(true)}
 else if(a==='again'){const pp=P.pass,lid=P.lid,sig=P.sig,tm=P.tm,du=!!P.duel;initP(P.t,P.qs,P.dir);P.pass=pp;P.lid=lid;P.sig=sig;if(tm)P.tm={...tm,qp:{},last:null,sk:null};if(du)initDuel();drawP(true)}
 else if(a==='review'){P.rv=true;P.show.fill(true);P.done=false;P.i=0;drawP(true)}
}
document.addEventListener('keydown',e=>{
 if(M){if(e.key==='Enter'&&e.target.id!=='mi'||e.key==='Enter'&&M.f==='line')modalOk();if(e.key==='Escape')closeModal();return}
 if(!P)return;const k=e.key.toLowerCase();if(P.duel){dlKey(k,e);return}
 if(/^(textarea|input)$/i.test(e.target.tagName)){
  if(k==='enter'&&!e.shiftKey){e.preventDefault();pAct('submit')}
  return;
 }
 if(k==='arrowright'||k===' '||k==='enter'){e.preventDefault();const s0=P.st[P.i];pAct(P.t==='order'&&OM!=='type'&&s0&&!P.done&&!s0.fin&&!s0.pool.length?'ocheck':'next')}
 else if(k==='arrowleft')pAct('prev');
 else if(k==='s')pAct('show');
 else if(k==='r')pAct('redo');
 else if(k==='t')pAct('theme');
 else if(P.t==='mc'&&/^[1-4]$/.test(k)&&+k<=P.qs[P.i].o.length)pAct('pick',+k-1);
 else if(P.t==='mc'&&'abcd'.includes(k)&&k.length===1&&'abcd'.indexOf(k)<P.qs[P.i].o.length)pAct('pick','abcd'.indexOf(k));
 else if(k==='escape')closeP();
});
