<meta name="theme-color" content="#3a5bff">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#16213e;--mut:#6a7490;--line:#dde3f0;--pri:#3a5bff;--ok:#16a34a;--bad:#e5484d;--yel:#ffc93c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0f1426;--card:#19203a;--ink:#e8ecfa;--mut:#97a1c4;--line:#2a3354;--pri:#6c86ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#app{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(26px,5vw,38px);margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 24px}
.crumb{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.crumb a{cursor:pointer;color:var(--pri);font-weight:500}.crumb a:hover{text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 18px 36px -14px hsl(var(--h) 70% 40%/.5);border-color:hsl(var(--h) 70% 60%)}
.card:active{transform:translateY(-2px) scale(.98)}
.band{height:104px;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 75% 46%));display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-size:38px;font-weight:800;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18);transition:transform .4s}
.card:hover .band::after{transform:scale(1.6)}
.cb{padding:14px 16px 16px}.cb b{display:block;font-size:17px;word-break:break-word}.cb span{color:var(--mut);font-size:13px}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.card:hover .tools,.card:focus-within .tools{opacity:1;transform:none}
.ib{border:0;background:rgba(255,255,255,.9);color:#16213e;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px;transition:transform .15s,background .15s}
.ib:hover{transform:scale(1.15);background:#fff}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--line);background:transparent;color:var(--mut);font-weight:500;gap:6px}
.add i{font-style:normal;font-size:34px;line-height:1;transition:transform .3s}
.add:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-4px)}.add:hover i{transform:rotate(90deg) scale(1.2)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let D=null;
try{D=JSON.parse(localStorage.getItem('quizdata')||'null')}catch(e){}
if(!D||!D.classes){D={classes:[{id:uid(),name:'Lớp mẫu',h:225,lessons:[{id:uid(),name:'Bài mẫu: Địa lí Việt Nam',questions:[
{q:'Thủ đô của Việt Nam là thành phố nào?',o:['Hà Nội','Huế','Đà Nẵng','TP. Hồ Chí Minh'],a:0},
{q:'Sông nào dài nhất chảy qua lãnh thổ Việt Nam?',o:['Sông Hồng','Sông Mê Công','Sông Đà','Sông Cầu'],a:1}]}]}]}}
const save=()=>{try{localStorage.setItem('quizdata',JSON.stringify(D))}catch(e){toast('Bộ nhớ trình duyệt đã đầy, hãy dùng hình nhỏ hơn hoặc xoá bớt bài tập')}};
const clampP=v=>Math.min(100,Math.max(1,Math.round(+v)||1));
function normD(){
D.classes.forEach(c=>c.lessons.forEach(l=>l.questions.forEach(q=>{q.p=clampP(q.p);if(l.type==='order'&&q.a==null&&q.q){q.a=q.q;q.q=''}})));
D.classes.forEach(c=>{c.units=c.units||[];const orph=c.lessons.filter(l=>!l.u||!c.units.some(u=>u.id===l.u));if(orph.length){let u=c.units[0];if(!u){u={id:uid(),name:'Bài học chung',date:''};c.units.push(u)}orph.forEach(l=>l.u=u.id)}});
}
normD();
let V={c:null,u:null,l:null},P=null,M=null;
const curC=()=>D.classes.find(x=>x.id===V.c),curL=()=>{const c=curC();return c&&c.lessons.find(x=>x.id===V.l)},curU=()=>{const c=curC();return c&&c.units.find(x=>x.id===V.u)};
const fmtDate=d=>d?String(d).split('-').reverse().join('/'):'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- Nhận diện câu hỏi ---------- */
const FM='\uE000',FE='\uE001',OKT=/\s*(?:\(\s*(?:đúng|correct|x)\s*\)|\[\s*(?:đúng|correct|x)\s*\]|[*✓✔✅☑])+\s*$/iu;
/* tách một dòng thành các phương án (A. B. C. D.), nhớ phương án nào được in đậm / gạch chân */
function segs(s){
 let t='',f=[],on=false;
 for(let i=0;i<s.length;i++){const ch=s[i];if(ch===FM){on=true;continue}if(ch===FE){on=false;continue}t+=ch;f.push(on&&/\S/.test(ch))}
 const cuts=[0];
 if(/^[*✓✔✅☑]?\s*\(?A[.)]/.test(t)&&/\s[*✓✔✅☑]?\(?B[.)]\s/.test(t))for(const m of t.matchAll(/\s+(?=[*✓✔✅☑]?\(?[B-D][.)]\s)/g))cuts.push(m.index);
 cuts.push(t.length);
 return cuts.slice(0,-1).map((a,j)=>({t:t.slice(a,cuts[j+1]).trim(),f:f.slice(a,cuts[j+1]).some(Boolean)}));
}
function optTake(c,p,f){
 const m=p.match(/^([*✓✔✅☑]?)\s*\(?([A-Da-d])[.)]\s*(.*)$/u);if(!m)return false;
 const k='ABCD'.indexOf(m[2].toUpperCase());let x=m[3],ok=!!m[1];
 if(OKT.test(x)){ok=true;x=x.replace(OKT,'')}
 c.o[k]=x;if(ok)c.a=k;if(f)c.fm.add(k);c.last=k;return true;
}
const KH=/^(?:đáp án|dap an|đ\/a|đa|answer|ans|key)\s*(?:đúng)?\s*(?:là)?\s*[:：\-.=]?\s*(.*)$/iu;
function parse(t){
 const out=[],PR=/(\d+)\s*[.:\-)=]?\s*\(?([A-Da-d])\)?(?![\p{L}\d])/gu,key={};let c=null,hdr=false;
 const flush=()=>{if(c){if(c.a<0&&c.fm.size===1)c.a=[...c.fm][0];delete c.last;delete c.fm;c.p=1;c.q=c.q.trim();c.o=c.o.map(s=>s.trim());if(c.q)out.push(c);c=null}};
 const pairs=x=>{if(x.replace(PR,'').replace(/[\s,;|]+/g,''))return 0;let n=0;for(const m of x.matchAll(PR)){key[m[1]]='ABCD'.indexOf(m[2].toUpperCase());n++}return n};
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim(),sc=s.replace(/[\uE000\uE001]/g,'');if(!sc)continue;let m;
  if(hdr&&pairs(sc))continue;
  hdr=false;
  if((m=sc.match(KH))){
   const r=m[1].trim();
   if(!r){hdr=true;continue}
   if(pairs(r))continue;
   const lm=r.match(/^\(?([A-Da-d])\)?(?:\s*[.):]\s*.*)?$/u);
   if(lm){if(c)c.a='ABCD'.indexOf(lm[1].toUpperCase());continue}
   if(c){const k=c.o.findIndex(o=>o&&norm(o)===norm(r));if(k>=0){c.a=k;continue}}
  }
  if(/^(?:\d+\s*[.:\-)=]?\s*\(?[A-Da-d]\)?(?![\p{L}\d])[\s,;|]*){2,}$/u.test(sc)&&pairs(sc))continue;
  if((m=sc.match(/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu))){
   flush();let q=m[2],a=-1;
   const im=q.match(/\s*[\(\[]\s*(?:đáp án|đ\/a|answer|ans|key)\s*[:\-=]?\s*([A-Da-d])\s*[\)\]]\s*$/iu);
   if(im){a='ABCD'.indexOf(im[1].toUpperCase());q=q.slice(0,im.index)}
   c={q,o:['','','',''],a,n:m[1],fm:new Set(),last:null};continue;
  }
  if(!c)continue;
  for(const p of segs(s)){if(!optTake(c,p.t,p.f)){if(c.last!=null)c.o[c.last]+=' '+p.t;else c.q+=' '+p.t}}
 }
 flush();
 out.forEach(q=>{if(q.a<0&&key[q.n]!=null)q.a=key[q.n];delete q.n});
 return out;
}
/* sắp xếp từ: mỗi dòng một câu */
function parseOrder(t){
 const r=parseText(t).filter(x=>x.a&&x.a.trim());
 if(r.length)return r;
 return parseOrderOld(t).map(x=>({q:'',a:x.q,p:1}));
}
function parseOrderOld(t){
 return t.replace(/\r/g,'').split('\n').map(s=>s.trim().replace(/^(?:câu\s*)?\d+\s*[.):]\s+/i,'')).filter(s=>s.split(/\s+/).length>=2).map(s=>({q:s,p:1}));
}
/* True / False / Not Given */
const tfv=s=>{s=norm(s).replace(/\s/g,'');return ['true','t','dung','yes','y'].includes(s)?0:['false','f','sai','no'].includes(s)?1:['notgiven','ng','n','notmentioned','khongdecap','khongduocdecap'].includes(s)?2:-1};
function parseTFNG(t){
 const passages={},qs=[],NUM=/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu,KEY=/^(?:đáp án|đ\/a|answer|ans|key)\s*(?:đúng)?\s*[:：=\-]?\s*(.*)$/iu,
  PR=/(\d+)\s*[.:\-)=]?\s*(not\s*given|true|false|ng|t|f|n|đúng|sai)(?![\p{L}])/giu,
  WD=/not\s*given|true|false|\bng\b|\bt\b|\bf\b|đúng|sai/giu,
  onlyAns=x=>{const tk=[...x.matchAll(WD)];return tk.length&&x.replace(WD,'').replace(/[\s,;|\/.\-–—]+/g,'')===''?tk.map(v=>tfv(v[0])):null},
  sp=x=>{
   let m=x.match(/^(.*?)\s*(?:→|->|=>|⇒)\s*(.+)$/u);if(m&&tfv(m[2])>=0)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?)\s*[\(\[]\s*([^)\]]+?)\s*[\)\]]\s*$/u);if(m&&tfv(m[2])>=0)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?[.!?])\s+(not\s*given|true|false|ng)\s*\.?\s*$/iu);if(m)return[m[1],tfv(m[2])];
   m=x.match(/^(.*?)\s*(?:[:|–—\/]|\s-)\s*(not\s*given|true|false|ng|t|f|đúng|sai)\s*\.?\s*$/iu);if(m&&m[1].trim())return[m[1],tfv(m[2])];
   return[x,-1]};
 for(const sec of t.replace(/\r/g,'').split(/\n\s*-{3,}\s*(?=\n|$)/)){
  const pid=uid(),pas=[],g=[],key={};let c=null,st=false,m,seq=[];
  for(const raw of sec.split('\n')){
   const s=raw.trim();
   if(!st){if((m=s.match(NUM))&&m[1]==='1')st=true;else{pas.push(raw);continue}}
   if(!s)continue;
   if((m=s.match(KEY))){
    const r=m[1].trim(),ps=[...r.matchAll(PR)];
    if(ps.length)ps.forEach(x=>{key[x[1]]=tfv(x[2])});
    else{const a=onlyAns(r)||[];if(a.length>1)seq=a;else if(c&&a.length===1)c.a=a[0];else if(c)c.a=tfv(r)}
    continue}
   if((m=s.match(/^(?:→|->|=>|⇒)\s*(.*)$/u))){if(c)c.a=tfv(m[1]);continue}
   const oa=onlyAns(s);
   if(oa&&c){if(oa.length>1)seq=oa;else c.a=oa[0];continue}
   if((m=s.match(NUM))){
    const ex=g.find(q=>q.n===m[1]);
    if(ex&&tfv(m[2])>=0){ex.a=tfv(m[2]);continue}
    const [x,a]=sp(m[2]);c={q:x,a,p:1,pid,n:m[1]};g.push(c)}
   else if(c)c.q+=' '+s;
  }
  g.forEach((q,i)=>{if(key[q.n]!=null)q.a=key[q.n];else if(seq[i]!=null&&q.a<0)q.a=seq[i]});
  if(g.length){passages[pid]=pas.join('\n').trim();qs.push(...g)}
 }
 return {passages,qs};
}

const TYPES={

const ARR=/^(?:→|->|=>|⇒|➜|➔)\s*(.*)$/u;
const ANSW=/^(?:đáp án|đ\/a|answer|ans|key)\s*(?:đúng)?\s*[:：=\-]\s*(.*)$/iu;
const ANSW0=/^(?:đáp án|answer)\s*$/iu;
const PAIR=/^(.+?)\s*(?:→|->|=>|⇒|\t|\s[-–—]\s|\s?=\s?|:|\|)\s*(.+)$/u;
function parseText(t){
 const out=[],NUM=/^(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu;let c=null;
 const lines=t.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
 const isA=s=>ARR.test(s)||ANSW.test(s)||ANSW0.test(s);
 const hasNum=lines.some(s=>!isA(s)&&NUM.test(s));
 const flush=()=>{if(c&&c.q.trim())out.push({q:c.q.trim(),a:c.a.trim(),p:1});c=null};
 for(const s of lines){
  let m=s.match(ARR)||s.match(ANSW)||(ANSW0.test(s)?['','']:null);
  if(m){if(c){c.in=true;c.a+=(c.a?'\n':'')+(m[1]||'')}continue}
  if(hasNum){
   if((m=s.match(NUM))){flush();c={q:m[2],a:'',in:false}}
   else if(c){if(c.in)c.a+=(c.a?'\n':'')+s;else c.q+='\n'+s}
   continue;
  }
  if(!c||c.in){flush();c={q:s,a:'',in:false}}else c.q+='\n'+s;
 }
 flush();return out;
}
function parseVocab(t){
 const out=[];
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim().replace(/^(?:câu\s*)?\d+\s*[.)]\s+/i,''),m=s.match(PAIR);
  if(m&&m[1].trim()&&m[2].trim())out.push({q:m[1].trim(),a:m[2].trim(),p:1});
 }
 return out;
}
function parseMatch(t){
 const blocks=[];let b=null;const nb=()=>{b={title:'',pairs:[]};blocks.push(b)};
 for(const raw of t.replace(/\r/g,'').split('\n')){
  const s=raw.trim();
  if(!s){b=null;continue}
  const h=s.match(/^(?:câu|question|q)\s*\d+\s*[.:)\-]?\s*(.*)$/iu);
  if(h){nb();b.title=h[1];continue}
  const m=s.replace(/^\d+\s*[.)]\s+/,'').match(PAIR);
  if(!b)nb();
  if(m)b.pairs.push([m[1].trim(),m[2].trim()]);
  else if(!b.pairs.length)b.title=(b.title?b.title+' ':'')+s;
 }
 let qs=blocks.filter(x=>x.pairs.length>=2);
 if(!qs.length){const all=blocks.flatMap(x=>x.pairs);qs=all.length>=2?[{title:'',pairs:all}]:[]}
 return qs.map(x=>({q:x.title.trim(),pairs:x.pairs,p:1}));
}

const BLK=/\[\s*\]|\(\s*\.{2,}\s*\)|\.{3,}|…+|_+/g;

   parts=a.split(/\s*[;|,]\s*/).filter(Boolean);
   if(parts.length!==n)parts=a.split(/\s+/);

}

function parsePassage(t){
 const passages={},qs=[];
 const NUM=/^\s*(?:câu|question|q)?\s*(\d+)\s*[.:)\-]\s*(.*)$/iu,OPT=/^\s*\*?\s*\(?[A-Da-d][.)]\s/;
 const KEY=/^(?:đáp án|đ\/a|answer|ans|key)\s*(?:đúng)?\s*[:：=\-]?\s*(.*)$/iu;
 const KEYLINE=/^(?:\d+\s*[.:\-)=]?\s*\(?[A-Da-d]\)?(?![\p{L}\d])[\s,;]*){2,}$/iu;
 const PAIRS=/(\d+)\s*[.:\-)=]?\s*\(?([A-Da-d])(?![\p{L}\d])/gu;
 for(const sec of t.replace(/\r/g,'').split(/\n\s*(?:-{3,}|={3,}|\*{3,})\s*(?=\n|$)/)){
  const raw=sec.split('\n'),lines=raw.map(x=>x.replace(/[\uE000\uE001]/g,''));let st=-1;
  for(let i=0;i<lines.length&&st<0;i++){
   const m=lines[i].match(NUM);if(!m)continue;
   if([m[2],...lines.slice(i+1,i+4)].some(x=>OPT.test(x)))st=i;
  }
  if(st<0)continue;
  const pid=uid(),group=[],key={};let c=null;
  passages[pid]=lines.slice(0,st).join('\n').trim();
  const fl=()=>{if(c){if(c.a<0&&c.fm.size===1)c.a=[...c.fm][0];delete c.fm;c.q=c.q.trim();c.o=c.o.map(x=>x.trim());delete c.last;group.push(c);c=null}};
  const feed=x=>{for(const p of segs(x)){if(!optTake(c,p.t,p.f)){if(c.last!=null)c.o[c.last]+=' '+p.t;else c.q+=' '+p.t}}};

   const s=lines[i].trim();if(!s)continue;let m;
   if((m=s.match(KEY))){
    const rest=m[1].trim();
    if(!addPairs(rest)){const sm=rest.match(/^\(?([A-Da-d])(?![\p{L}\d])/u);if(sm&&c)c.a='ABCD'.indexOf(sm[1].toUpperCase())}
    continue;
   }
   if(KEYLINE.test(s)){addPairs(s);continue}
   if((m=s.match(NUM))){fl();c={q:'',o:['','','',''],a:-1,p:1,pid,n:m[1],last:null,fm:new Set()};feed(raw[i].replace(/^[\uE000\uE001\s]*(?:câu|question|q)?\s*\d+[\uE000\uE001]*\s*[.:)\-]\s*/iu,''));continue}
   if(c)feed(raw[i]);
  }
  fl();
  group.forEach(q=>{if(key[q.n]!=null)q.a=key[q.n]});
  qs.push(...group);
 }

}

 if(a==='back'){if(V.l)V.l=null;else if(V.u)V.u=null;else V.c=null;render();scrollTo(0,0)}

 else if(a==='del-c'){const x=D.classes.find(z=>z.id===id);modal({t:'Xoá lớp?',msg:`Lớp “${x.name}” và toàn bộ bài học bên trong sẽ bị xoá.`,ok:'Xoá lớp',danger:1,cb:()=>{D.classes=D.classes.filter(z=>z.id!==id);save();render()}})}
 else if(a==='add-l')gChoose();
 else if(a==='ren-l'){const x=c.lessons.find(z=>z.id===id);modal({t:'Đổi tên bài tập',f:'line',v:x.name,cb:v=>{x.name=v;save();render()}})}
 else if(a==='del-l'){const x=c.lessons.find(z=>z.id===id);modal({t:'Xoá bài tập?',msg:`Bài tập “${x.name}” và các câu hỏi sẽ bị xoá.`,ok:'Xoá bài tập',danger:1,cb:()=>{clearResume(id);c.lessons=c.lessons.filter(z=>z.id!==id);save();render()}})}
 else if(a==='upload')$('#file').click();
 else if(a==='paste')modal({t:'Dán văn bản câu hỏi',f:'area',ph:PH[T(l)],ok:'Tạo câu hỏi',cb:addParsed});
 else if(a==='addq'){l.questions.push(newQ(l));save();render();const t=document.querySelectorAll('[data-f="q"]');t[t.length-1].focus()}
 else if(a==='bulk')bulkModal(l);
 else if(a==='addpass'){l.passages=l.passages||{};const pid=uid();l.passages[pid]='';l.questions.push(T(l)==='tfng'?{q:'',a:-1,p:1,pid}:{q:'',o:['','','',''],a:-1,p:1,pid,n:'1'});save();render();const tt=document.querySelectorAll('[data-f="pt"]');tt[tt.length-1].focus()}

function gBn(ok,to){const e=$('#gm');e.insertAdjacentHTML('beforeend',`<div class="gbn ${ok?'ok':'bad'}">${to?'⏰ Hết giờ!':ok?'✔ Chính xác!':'✖ Chưa đúng'}</div>`);if(ok)for(let i=0;i<18;i++)e.insertAdjacentHTML('beforeend',`<i class="gcf" style="--x:${(Math.random()*90-45).toFixed(0)}vw;--y:${(Math.random()*70-40).toFixed(0)}vh;--r:${(Math.random()*720-360).toFixed(0)}deg;animation-delay:${(Math.random()*.15).toFixed(2)}s">${['🎉','⭐','✨','🎊'][i%4]}</i>`)}
function gOpts(){const q=G.q,pk=G.pick;return `<div class="gop">`+q.o.map((o,i)=>{const hid=G.hid&&G.hid.includes(i),st=pk==null?'':i===q.a?' ok':i===pk?' bad':'';return `<button class="go${st}${hid?' gone':''}" data-gg="a" data-i="${i}" ${G.lock||hid?'disabled':''}>${'ABCD'[i]}. ${esc(o)}${G.poll?`<i class="gpl" style="width:${G.poll[i]}%"></i>`:''}</button>`}).join('')+`</div>`}
const gTurn=l=>`<b class="gturn" style="--c:${GC[G.turn]}">${GE[G.turn]} ${l||'Lượt'}: ${esc(G.nm[G.turn])}</b>`,gNum=t=>`<span class="gnum">${t}</span>`;
const gQP=(small,q,ex)=>{const w=G.k==='grid'||['essay','vocab'].includes(T(G.l)),h=`<div class="gqp ${w?'win':'side'}${G.fr?' in':''}"><div class="gqc"><small>${small}</small><h3>${esc(q)}</h3>${ex||''}${gOpts()}</div></div>`;if(w)return h;G.pn=h;return ''};
const gQH=(small,q)=>`<div class="gq${G&&G.fr?' in':''}"><small>${small}</small>${esc(q)}</div>`;
function gWhack(){const ix=G.q.o.map((_,i)=>i).filter(i=>!G.wr.includes(i)),c=shuf([...Array(9).keys()]).slice(0,ix.length);return `<div class="gh">`+[...Array(9).keys()].map(h=>{const j=c.indexOf(h);return `<div class="gho">${j>=0?`<button class="go gmo" data-gg="a" data-i="${ix[j]}">${esc(G.q.o[ix[j]])}</button>`:''}</div>`}).join('')+`</div>`}
const GV={
grid(){return gQH(gTurn(),G.sel==null?'Chọn một ô để giành lấy':'Trả lời đúng để chiếm ô')+`<div class="gb">`+G.cells.map((v,i)=>`<button class="gc${v>=0?' t':''}${i===G.sel?' sel':''}" style="${v>=0?'--c:'+GC[v]:''}" data-gg="cell" data-i="${i}" ${v>=0||G.sel!=null?'disabled':''}>${v>=0?esc(G.nm[v][0].toUpperCase()):i+1}</button>`).join('')+`</div>`+(G.sel!=null?gQP(gTurn()+gNum('Ô số '+(G.sel+1)),G.q.q):'')},
bomb(){return gQH(gTurn('💣 Bom đang ở')+gNum('Quả '+G.round+'/'+G.s.m),G.boom?'💥 BÙM!':G.q.q)+`<div class="gfz"><i class="gfzi" style="width:${Math.max(0,G.left/G.s.t*100)}%"></i></div>`+(G.boom?`<div class="gbo">💥 ${esc(G.nm[G.turn])} bị trừ 10 điểm</div>`:gOpts())},
arc(){const k=G.k,t=G.s.t*(k==='whack'?1:1.3);let a;if(G.lock)a=`<div class="gar gst">${gOpts()}</div>`;else a=`<div class="gbar" style="--t:${t}s"></div><div class="gar" id="gar">${k==='whack'?gWhack():G.q.o.map((o,i)=>k==='fall'?`<button class="go gfl" style="left:${i*25+1}%;--t:${G.s.t}s;--d:${(Math.random()*G.s.t*.3).toFixed(2)}s" data-gg="a" data-i="${i}">${esc(o)}</button>`:`<button class="gbl" style="left:${5+i*23}%;--t:${G.s.t}s;--d:${(Math.random()*G.s.t*.3).toFixed(2)}s;--hu:${i*85+15}" data-gg="a" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;return gQH(gTurn()+gNum('Câu '+G.round+'/'+G.s.m)+gNum('Còn <span id="gpt">20</span> điểm'),G.q.q)+a},
mil(){const k=G.rung[G.turn],ll=G.ll[G.turn],inf=gTurn()+gNum('Câu '+(k+1)+'/'+G.s.m)+gNum(G.pz[k].toLocaleString('vi-VN')+' điểm'),lf=`<div class="gl">${[['f','50:50'],['a','Hỏi cả lớp'],['s','Đổi câu']].map(([x,n])=>`<button class="b g" data-gg="ll" data-k="${x}" ${ll[x]||G.lock||(x==='f'&&G.q.o.length<3)?'disabled':''}>${n}</button>`).join('')}</div>`;return `<div class="gml"><div>`+gQH(inf,G.q.q)+lf+gOpts()+`</div><div class="glad">`+G.pz.map((p,i)=>`<div class="${i===k?'on':''}${i<k?' dn':''}${(i+1)%5===0?' sf':''}">${i+1} · ${p.toLocaleString('vi-VN')}</div>`).reverse().join('')+`</div></div>`},
boss(){const n=G.s.n,BO=['🐲','👹','🦖','👾','🐙'];return `<div class="gbs n${n}">`+G.hp.map((h,i)=>`<div class="gbc${G.turn===i?' on':''}${h<=0?' dead':''}" style="--c:${GC[i]}"><div class="gbo ${G.turn===i&&G.lock&&G.pick!=null?(G.pick===G.q.a?'hit':'hurt'):''}">${h<=0?'💀':BO[i]}</div><div class="ghp"><i style="width:${Math.max(0,h)/G.s.m*100}%"></i></div><small>${n>1?esc(G.nm[i])+' · ':''}${Math.max(0,h)}/${G.s.m} máu</small></div>`).join('')+`</div>`+gQH(gTurn()+gNum('Boss còn '+G.hp[G.turn]+' máu'),G.q.q)+gOpts()}};
GV.fall=GV.whack=GV.balloon=GV.arc;
function gDraw(){if(!G)return;G.fr=G.nq;G.nq=0;let h=gHead();
 if(G.end){const r=G.nm.map((n,i)=>[n,G.sc[i],i]).sort((a,b)=>b[1]-a[1]);h+=`<div class="gres"><div class="gtr">🏆</div><h2>${esc(G.end.title)}</h2><p>${esc(G.end.msg)}</p>${r.map((x,j)=>`<div class="grk" style="--c:${GC[x[2]]}"><span>${j+1}</span>${esc(x[0])}<b>${x[1]}</b></div>`).join('')}<div class="gl"><button class="b p" data-gg="re">↺ Chơi lại</button><button class="b g" data-gg="x">Đóng</button></div></div>`}
 else{G.pn='';const bd=GV[G.k]();h+=`<div class="gplay"><div class="gmain">${bd}</div>${G.pn}</div>`}$('#gm').innerHTML=h;gFx()}
function gArm(){const s=G.s,w=(G.k==='whack'?s.t:s.t*1.3)*1000;gT(()=>{gClr();G.lock=1;arcFreeze();const c=document.querySelector(`#gar [data-i="${G.q.a}"]`);if(c)c.classList.add('ok');gBn(false,true);gT(()=>{G.lock=0;aNext(false,0)},1100)},w);if(G.k==='whack')gI(()=>{const a=$('#gar');if(a&&!G.lock)a.innerHTML=gWhack()},1400)}
const arcFreeze=()=>document.querySelectorAll('#gar [data-i]').forEach(e=>e.style.animationPlayState='paused');
function gArc(i){const b=document.querySelector(`#gar [data-i="${i}"]`);if(!b||G.wr.includes(i)||G.lock)return;
 if(i===G.q.a){gClr();G.lock=1;const pts=Math.round(20*(1-.25*G.wr.length));arcFreeze();b.classList.add('ok');gBn(true);gT(()=>{G.lock=0;aNext(true,pts)},1000)}
 else{G.wr.push(i);b.classList.add('bad');b.disabled=true;b.style.animationPlayState='paused';const a=$('#gar');a.classList.remove('gshk');void a.offsetWidth;a.classList.add('gshk');const t=$('#gpt');if(t)t.textContent=Math.round(20*(1-.25*G.wr.length));setTimeout(()=>{b.style.opacity=0;b.style.pointerEvents='none'},450)}}
function aNext(ok,pts){if(ok)G.sc[G.turn]+=pts;if(G.round>=G.s.m)return gEnd('Hết giờ chơi!','Đội nhiều điểm nhất chiến thắng');G.round++;gNx();G.q=gQ();gDraw();gArm()}
function gLine(i){const v=G.cells[i],r=i/5|0,c=i%5;for(const[d,e]of[[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(const sg of[1,-1]){let y=r+d*sg,x=c+e*sg;while(y>=0&&y<5&&x>=0&&x<5&&G.cells[y*5+x]===v){n++;y+=d*sg;x+=e*sg}}if(n>=G.s.line)return 1}return 0}
function gGridA(ok){const i=G.sel;G.sel=null;if(ok){G.cells[i]=G.turn;G.sc[G.turn]++;if(gLine(i))return gEnd('🏆 '+G.nm[G.turn]+' thắng!','Nối được '+G.s.line+' ô liên tiếp')}
 if(G.cells.every(v=>v>=0)){const m=Math.max(...G.sc);return gEnd('Hết ô!','Đội chiếm nhiều ô nhất: '+G.nm.filter((_,k)=>G.sc[k]===m).join(', '))}
 gNx();gDraw()}
function gBombA(ok){if(ok){G.sc[G.turn]+=10;gNx()}G.q=gQ();gDraw()}
function gMilA(ok){const t=G.turn;if(ok){G.rung[t]++;G.sc[t]=G.pz[G.rung[t]-1];if(G.rung[t]>=G.s.m)G.out[t]=1}else{G.out[t]=1;const sf=Math.floor(G.rung[t]/5)*5;G.sc[t]=sf?G.pz[sf-1]:0}
 if(G.out.every(x=>x)){const m=Math.max(...G.sc);return gEnd('Kết thúc!','Đội cao điểm nhất: '+G.nm.filter((_,k)=>G.sc[k]===m).join(', '))}
 gNx();G.q=gQ();G.hid=null;G.poll=null;gDraw()}
function gBossA(ok){const t=G.turn;if(ok){G.hp[t]--;G.sc[t]++}else{G.hr[t]--;if(G.hr[t]<=0)G.out[t]=1}
 if(G.hp[t]<=0)return gEnd('🎉 '+G.nm[t]+' hạ gục boss!','Về đích đầu tiên nên chiến thắng');
 if(G.out.every(x=>x))return gEnd('💀 Boss thắng','Tất cả các đội đã hết tim');
 gNx();G.q=gQ();gDraw()}
function gLL(x){if(G.lock||G.end)return;const l=G.ll[G.turn];if(l[x])return;l[x]=1;const q=G.q;
 if(x==='f')G.hid=shuf(q.o.map((_,i)=>i).filter(i=>i!==q.a)).slice(0,2);
 else if(x==='a'){const c=45+Math.random()*35,r=q.o.map(()=>Math.random()+.1),sm=r.reduce((s,v,i)=>i===q.a?s:s+v,0)||1;G.poll=r.map((v,i)=>i===q.a?Math.round(c):Math.round((100-c)*v/sm))}
 else{G.q=gQ();G.hid=null;G.poll=null}
 gDraw()}
function gClick(i){if(G.lock||G.end)return;const k=G.k;if(k==='fall'||k==='whack'||k==='balloon')gArc(i);else gRes(i,{grid:gGridA,bomb:gBombA,mil:gMilA,boss:gBossA}[k])}
$('#gm').addEventListener('click',e=>{const b=e.target.closest('[data-gg]');if(!b||!G)return;const a=b.dataset.gg,i=+b.dataset.i;
 if(a==='x')gClose();else if(a==='re')gPlay(G.l);else if(a==='a')gClick(i);else if(a==='ll')gLL(b.dataset.k);
 else if(a==='cell'&&!G.lock&&G.sel==null&&G.cells[i]<0){G.sel=i;G.q=gQ();gDraw()}});
document.addEventListener('keydown',e=>{if(G&&e.key==='Escape')gClose()});
</script>
